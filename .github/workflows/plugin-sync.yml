name: Plugin sync check

# Fails if the bundled Claude Code plugin (plugins/product-toolchest) has
# drifted from the repo-root source of truth (prompts/, .claude/, .kiro/hooks.json).
# Fix locally with: ./scripts/sync-plugin.sh  then commit the result.

on:
  push:
    branches: [main]
    paths:
      - 'prompts/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.kiro/hooks.json'
      - 'plugins/product-toolchest/**'
      - 'scripts/sync-plugin.sh'
      - '.github/workflows/plugin-sync.yml'
  pull_request:
    paths:
      - 'prompts/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.kiro/hooks.json'
      - 'plugins/product-toolchest/**'
      - 'scripts/sync-plugin.sh'
      - '.github/workflows/plugin-sync.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify bundled plugin matches the repo-root source
        run: ./scripts/sync-plugin.sh --check
