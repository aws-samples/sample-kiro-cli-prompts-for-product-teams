name: release

# Publishes a GitHub Release when a vX.Y.Z tag is pushed. Nothing else triggers it.
# Guards (all must pass before anything is published):
#   - the tag matches ^v[0-9]+\.[0-9]+\.[0-9]+$ (no pre-release tags)
#   - VERSION at the tagged commit equals the tag (without the "v")
#   - the tagged commit is reachable from main
#   - shellcheck, the content check and the full test suite pass (cli.yml)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: check tag format, VERSION and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          sh scripts/check-release-tag.sh "$TAG"

  test:
    needs: guard
    uses: ./.github/workflows/cli.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/build-release.sh "$TAG" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/product-team-ai-kit-*.tar.gz
            dist/install.sh

  release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: verify assets before publishing
        working-directory: dist
        run: sha256sum -c checksums.txt
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "product-team-ai-kit $TAG" \
            "dist/product-team-ai-kit-$TAG.tar.gz" \
            dist/install.sh \
            dist/checksums.txt
