name: cli

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: shellcheck + content check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh bin/product-team-ai-kit scripts/*.sh tests/run.sh
      - name: content consistency (drift) check
        run: sh scripts/check.sh

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [dash, bash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install dash (macOS)
        if: runner.os == 'macOS' && matrix.shell == 'dash'
        run: brew install dash
      - name: run tests
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          command -v "$TEST_SHELL"
          "$TEST_SHELL" tests/run.sh "$TEST_SHELL"
